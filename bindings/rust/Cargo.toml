[package]
name = "wccs"
version = "1.0.2"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "Rust binding for WCCS (Weighted Credit-Cooldown Sampler) C ABI"
repository = "https://github.com/Yuanyuan5510/WCCS"
readme = "README.md"
build = "build.rs"
# vendor/ is generated by the release job and ignored by git, so list it
# explicitly; otherwise `cargo package` would drop the C source and the
# published crate could not build.
include = ["src/**", "vendor/**", "build.rs", "examples/**", "Cargo.toml", "README.md"]

[lib]
name = "wccs"
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[[example]]
name = "vector"
path = "examples/vector.rs"
