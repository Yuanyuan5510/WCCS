[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wccs"
version = "1.0.1"
description = "Python binding for WCCS (Weighted Credit-Cooldown Sampler)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Yuanyuan5510" }]
keywords = ["sampling", "weighted", "cooldown", "deterministic", "ffi"]

[project.urls]
Repository = "https://github.com/Yuanyuan5510/WCCS"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["wccs"]

# The release build copies the platform native library next to __init__.py so
# the wheel is self-contained (see .github/workflows/ci.yml).
[tool.setuptools.package-data]
wccs = ["*.dll", "*.so", "*.dylib"]
