name: CI

# Release model
#   push to main / PR    -> tests only (core, bindings, wasm). Fast.
#   push tag v<X.Y.Z>    -> version gate -> full build -> package -> GitHub Release
#                           The tag MUST equal the VERSION file, otherwise the
#                           run fails and nothing is built or published.
#   manual dispatch      -> version gate -> full build + package (no Release)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- gate
  version-check:
    name: version gate
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: check
        name: VERSION, package manifests and tag must agree
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION file: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PY=$(python -c "import tomllib;print(tomllib.load(open('bindings/python/pyproject.toml','rb'))['project']['version'])")
          RS=$(python -c "import tomllib;print(tomllib.load(open('bindings/rust/Cargo.toml','rb'))['package']['version'])")
          JS=$(python -c "import json;print(json.load(open('bindings/node/package.json'))['version'])")

          fail=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 version '$2' does not match VERSION '$VERSION'"
              fail=1
            else
              echo "ok   $1 = $2"
            fi
          }
          check pyproject.toml "$PY"
          check Cargo.toml "$RS"
          check package.json "$JS"
          test "$fail" -eq 0

          # CMakeLists.txt reads VERSION directly, so the C/C++ SDK cannot drift.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag 'v$TAG' does not match VERSION '$VERSION'; refusing to build or publish"
              exit 1
            fi
            echo "tag matches VERSION: v$VERSION"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "not a release tag"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- stage 1
  core:
    name: core (${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was retired on 2026-11-02; macos-15 is the current
        # GitHub-hosted arm64 image.
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWCCS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test C core matrix + C++ binding
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify installed pkg-config / CMake package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # wccs.pc embeds CMAKE_INSTALL_PREFIX, so configure with the real
          # destination prefix rather than overriding it at install time.
          cmake -B build-pc -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PWD/_install_pc" -DWCCS_BUILD_TESTS=OFF
          cmake --build build-pc --parallel 4
          cmake --install build-pc
          PC=$(find _install_pc -name wccs.pc | head -1)
          echo "pkg-config file: $PC"
          PKG_CONFIG_PATH="$(dirname "$PC")" pkg-config --cflags --libs wccs
          test -n "$(find _install_pc -name wccs-config.cmake | head -1)"

  # ---------------------------------------------------------------- stage 2
  bindings:
    name: bindings (${{ matrix.os }})
    needs: [version-check, core]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C core (shared library for FFI bindings)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4

      - name: Rust unit tests
        run: cargo test --manifest-path bindings/rust/Cargo.toml

      - name: Python unit tests
        run: python -m unittest discover -s bindings/python/tests -v
        env:
          PYTHONPATH: bindings/python

      - name: Node dependencies
        run: npm ci --prefix bindings/node

      - name: Cross-language consistency (SHA-256 fixed vector)
        run: python tests/run_cross_lang.py

      - name: Node CJS + ESM loaders
        run: npm test --prefix bindings/node

  # ---------------------------------------------------------------- stage 3
  wasm:
    name: wasm fallback
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Compile the C core to wasm32
        run: bash bindings/node/wasm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wccs-wasm
          path: |
            bindings/node/wasm/wccs.mjs
            bindings/node/wasm/wccs.wasm
          if-no-files-found: error

  # ---------------------------------------------------------------- stage 4
  package:
    name: package (${{ matrix.os }})
    needs: [version-check, core, bindings, wasm]
    # Only a matching v* tag or a manual run packages artifacts. A plain push
    # to main stops after the tests above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build + install C/C++ SDK
        shell: bash
        run: |
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release -DWCCS_BUILD_TESTS=OFF \
                -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist/sdk"
          cmake --build build-rel --config Release --parallel 4
          cmake --install build-rel --config Release

      - name: Locate the native library
        shell: bash
        run: |
          LIB=$(find build-rel \( -name 'libwccs.dll' -o -name 'wccs.dll' \
                 -o -name 'libwccs.so' -o -name 'libwccs.dylib' \) | head -1)
          test -n "$LIB"
          echo "native library: $LIB"
          echo "WCCS_LIB=$LIB" >> "$GITHUB_ENV"

      - name: Python wheel (native library bundled, platform tagged)
        shell: bash
        run: |
          cp "$WCCS_LIB" bindings/python/wccs/
          python -m pip install --upgrade build
          if [ "$RUNNER_OS" = "Linux" ]; then
            # PyPI rejects bare linux_x86_64 wheels. Tag with the glibc that
            # this runner actually has (PEP 600). The tag states the real
            # minimum glibc instead of over-claiming manylinux2014.
            GLIBC=$(getconf GNU_LIBC_VERSION | awk '{print $2}' | tr '.' '_')
            PLAT="manylinux_${GLIBC}_x86_64"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            PLAT="macosx_11_0_arm64"
          else
            PLAT=$(python -c "import sysconfig;p=sysconfig.get_platform();print(p.replace('-','_').replace('.','_'))")
          fi
          echo "wheel platform: $PLAT"
          python -m build --wheel --outdir dist/wheels \
            --config-setting="--build-option=--plat-name=$PLAT" bindings/python
          ls -l dist/wheels

      - name: npm packages (root tarball + platform package)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) PKG=wccs-win32-x64;     OS=win32;  CPU=x64 ;;
            Linux)   PKG=wccs-linux-x64-gnu; OS=linux;  CPU=x64 ;;
            macOS)   PKG=wccs-darwin-arm64;  OS=darwin; CPU=arm64 ;;
          esac
          VERSION=$(tr -d '[:space:]' < VERSION)
          mkdir -p "dist/npm-platform/$PKG" dist/npm
          cp "$WCCS_LIB" "dist/npm-platform/$PKG/"
          cat > "dist/npm-platform/$PKG/package.json" <<EOF
          {
            "name": "$PKG",
            "version": "$VERSION",
            "description": "Prebuilt WCCS native library for $OS-$CPU",
            "license": "Apache-2.0",
            "os": ["$OS"],
            "cpu": ["$CPU"],
            "files": ["*.dll", "*.so", "*.dylib"],
            "repository": { "type": "git", "url": "https://github.com/Yuanyuan5510/WCCS.git" }
          }
          EOF
          npm pack ./bindings/node --pack-destination "$GITHUB_WORKSPACE/dist/npm"
          ls -l "dist/npm-platform/$PKG" dist/npm

      - name: C# library + native dependency
        shell: bash
        run: |
          dotnet build bindings/csharp/Wccs/Wccs.csproj -c Release -o dist/csharp
          cp "$WCCS_LIB" dist/csharp/

      - name: Rust crate (vendored C source, self-contained)
        shell: bash
        run: |
          mkdir -p bindings/rust/vendor
          cp src/wccs.c include/wccs.h bindings/rust/vendor/
          cargo package --manifest-path bindings/rust/Cargo.toml \
                --allow-dirty --no-verify
          mkdir -p dist/rust
          cp bindings/rust/target/package/*.crate dist/rust/

      - name: Bundle platform artifacts
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          python -c "import os, shutil; shutil.make_archive('wccs-' + os.environ['OS_LABEL'] + '-artifacts', 'zip', 'dist')"

      - uses: actions/upload-artifact@v4
        with:
          name: wccs-dist-${{ matrix.os }}
          path: wccs-${{ matrix.os }}-artifacts.zip
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------- stage 5
  release:
    name: publish GitHub Release
    needs: [package, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          name: WCCS ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true

  # ---------------------------------------------------------------- stage 6
  publish-pypi:
    name: publish to PyPI
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    # Environment-scoped secrets are only visible to jobs that declare the
    # environment, so this must match the GitHub environment name.
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wccs-dist-*
          path: bundles

      - name: Collect platform wheels
        run: |
          mkdir -p dist unpack
          find bundles -name '*.zip' -exec unzip -o -q {} -d unpack \;
          find unpack -name '*.whl' -exec cp {} dist/ \;
          echo "wheels to publish:"
          ls -1 dist

      - name: Check PyPI token
        id: pypi-token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          # PyPI publication is deliberately opt-in. The original token was
          # exposed in chat and has been revoked; keep this off until a fresh
          # token is stored and PUBLISH_PYPI is set to "true" in repo variables.
          ENABLE_PYPI: ${{ vars.PUBLISH_PYPI }}
        run: |
          # Step-level env is NOT visible to `if:` expressions, so testing
          # env.PYPI_TOKEN there always evaluates as empty and silently skips
          # the upload even when the secret is set. Evaluate in the shell and
          # pass the result through a step output instead.
          if [ "$ENABLE_PYPI" != "true" ]; then
            echo "::warning::PyPI publication is paused; set the repo variable PUBLISH_PYPI=true to enable it. Wheels were built but not uploaded."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::PUBLISH_PYPI is enabled but PYPI_TOKEN is not set"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.pypi-token.outputs.present == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  # ---------------------------------------------------------------- stage 7
  publish-npm:
    name: publish to npm
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wccs-dist-*
          path: bundles

      - name: Collect npm artifacts
        run: |
          mkdir -p unpack npm-platform npm-root
          find bundles -name '*.zip' -exec unzip -o -q {} -d unpack \;
          find unpack -path '*npm-platform/*/package.json' -print0 |
            while IFS= read -r -d '' f; do cp -r "$(dirname "$f")" npm-platform/; done
          find unpack -name '*.tgz' -exec cp {} npm-root/ \;
          echo "platform packages:"; ls -1 npm-platform
          echo "root tarballs:"; ls -1 npm-root

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN is not set"; exit 0; fi
          for d in npm-platform/*/; do
            [ -f "$d/package.json" ] || continue
            name=$(node -p "require('./$d/package.json').name")
            ver=$(node -p "require('./$d/package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "${name}@${ver} already published; skipping"
              continue
            fi
            # Leading ./ forces npm to treat this as a local directory,
            # not a GitHub "owner/repo" package spec.
            npm publish "./${d}" --access public
          done

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::NPM_TOKEN is not set"; exit 0; fi
          VERSION="${GITHUB_REF_NAME#v}"
          TGZ=$(find npm-root -maxdepth 1 -name 'wccs-*.tgz' | head -1)
          test -n "$TGZ" || { echo "::error::root tarball not found"; exit 1; }
          if npm view "wccs@${VERSION}" version >/dev/null 2>&1; then
            echo "wccs@${VERSION} already published; skipping"
            exit 0
          fi
          # A bare "npm-root/wccs-1.0.0.tgz" is parsed by npm as the GitHub
          # shorthand github:npm-root/wccs-1.0.0.tgz, which triggers
          # "git ls-remote ssh://git@github.com/... Permission denied".
          # The ./ prefix makes it an unambiguous local tarball.
          npm publish "./${TGZ}" --access public

  # ---------------------------------------------------------------- stage 8
  publish-nuget:
    name: publish to NuGet
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: wccs-dist-*
          path: bundles

      - name: Assemble native libraries per RID
        shell: bash
        run: |
          mkdir -p native
          for z in $(find bundles -name '*.zip'); do
            case "$(basename "$z")" in
              *windows*) rid=win-x64 ;;
              *ubuntu*)  rid=linux-x64 ;;
              *macos*)   rid=osx-arm64 ;;
              *) continue ;;
            esac
            dest="unpack/$rid"
            mkdir -p "$dest" "native/$rid"
            unzip -o -q "$z" -d "$dest"
            lib=$(find "$dest" \( -name 'libwccs.dll' -o -name 'wccs.dll' \
                   -o -name 'libwccs.so' -o -name 'libwccs.dylib' \) | head -1)
            test -n "$lib"
            cp "$lib" "native/$rid/"
          done
          find native -type f

      - name: Pack (all RIDs in one nupkg)
        shell: bash
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          dotnet pack bindings/csharp/Wccs/Wccs.csproj -c Release -o dist \
            -p:PackageVersion="$VERSION" -p:WccsNativeDir="$PWD/native"
          ls -l dist

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "::warning::NUGET_API_KEY is not set"; exit 0; fi
          dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  # ---------------------------------------------------------------- stage 9
  publish-crates:
    name: publish to crates.io
    needs: [version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Vendor C sources
        run: |
          mkdir -p bindings/rust/vendor
          cp src/wccs.c include/wccs.h bindings/rust/vendor/

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set"; exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # crates.io is immutable: republishing an existing version fails.
          # Skip on a re-run of the same tag so the other registries can be
          # retried safely.
          if curl -fsS -H "User-Agent: wccs-ci" \
               "https://crates.io/api/v1/crates/wccs/${VERSION}" >/dev/null 2>&1; then
            echo "wccs@${VERSION} already on crates.io; skipping"
            exit 0
          fi
          cargo publish --manifest-path bindings/rust/Cargo.toml --allow-dirty

# Registry publication runs only on a v* tag that passed the version gate.
# All four publish jobs are idempotent so a tag can be re-run safely:
#   PyPI      : skip-existing
#   npm       : npm view <name>@<version> before publishing
#   NuGet     : --skip-duplicate
#   crates.io : crates.io version lookup before cargo publish
# Secrets live in the "release" environment; each publish job declares it.
# All binding versions must resolve to the same WCCS_ABI_VERSION (section 6).
