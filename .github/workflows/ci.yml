name: CI

# Release model
#   push to main / PR    -> tests only (core, bindings, wasm). Fast.
#   push tag v<X.Y.Z>    -> version gate -> full build -> package -> GitHub Release
#                           The tag MUST equal the VERSION file, otherwise the
#                           run fails and nothing is built or published.
#   manual dispatch      -> version gate -> full build + package (no Release)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- gate
  version-check:
    name: version gate
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: check
        name: VERSION, package manifests and tag must agree
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "VERSION file: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PY=$(python -c "import tomllib;print(tomllib.load(open('bindings/python/pyproject.toml','rb'))['project']['version'])")
          RS=$(python -c "import tomllib;print(tomllib.load(open('bindings/rust/Cargo.toml','rb'))['package']['version'])")
          JS=$(python -c "import json;print(json.load(open('bindings/node/package.json'))['version'])")

          fail=0
          check() {
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 version '$2' does not match VERSION '$VERSION'"
              fail=1
            else
              echo "ok   $1 = $2"
            fi
          }
          check pyproject.toml "$PY"
          check Cargo.toml "$RS"
          check package.json "$JS"
          test "$fail" -eq 0

          # CMakeLists.txt reads VERSION directly, so the C/C++ SDK cannot drift.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag 'v$TAG' does not match VERSION '$VERSION'; refusing to build or publish"
              exit 1
            fi
            echo "tag matches VERSION: v$VERSION"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "not a release tag"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- stage 1
  core:
    name: core (${{ matrix.os }})
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was retired on 2026-11-02; macos-15 is the current
        # GitHub-hosted arm64 image.
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWCCS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test C core matrix + C++ binding
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify installed pkg-config / CMake package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # wccs.pc embeds CMAKE_INSTALL_PREFIX, so configure with the real
          # destination prefix rather than overriding it at install time.
          cmake -B build-pc -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PWD/_install_pc" -DWCCS_BUILD_TESTS=OFF
          cmake --build build-pc --parallel 4
          cmake --install build-pc
          PC=$(find _install_pc -name wccs.pc | head -1)
          echo "pkg-config file: $PC"
          PKG_CONFIG_PATH="$(dirname "$PC")" pkg-config --cflags --libs wccs
          test -n "$(find _install_pc -name wccs-config.cmake | head -1)"

  # ---------------------------------------------------------------- stage 2
  bindings:
    name: bindings (${{ matrix.os }})
    needs: [version-check, core]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C core (shared library for FFI bindings)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4

      - name: Rust unit tests
        run: cargo test --manifest-path bindings/rust/Cargo.toml

      - name: Python unit tests
        run: python -m unittest discover -s bindings/python/tests -v
        env:
          PYTHONPATH: bindings/python

      - name: Node dependencies
        run: npm ci --prefix bindings/node

      - name: Cross-language consistency (SHA-256 fixed vector)
        run: python tests/run_cross_lang.py

      - name: Node CJS + ESM loaders
        run: npm test --prefix bindings/node

  # ---------------------------------------------------------------- stage 3
  wasm:
    name: wasm fallback
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Compile the C core to wasm32
        run: bash bindings/node/wasm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wccs-wasm
          path: |
            bindings/node/wasm/wccs.mjs
            bindings/node/wasm/wccs.wasm
          if-no-files-found: error

  # ---------------------------------------------------------------- stage 4
  package:
    name: package (${{ matrix.os }})
    needs: [version-check, core, bindings, wasm]
    # Only a matching v* tag or a manual run packages artifacts. A plain push
    # to main stops after the tests above.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build + install C/C++ SDK
        shell: bash
        run: |
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release -DWCCS_BUILD_TESTS=OFF \
                -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/dist/sdk"
          cmake --build build-rel --config Release --parallel 4
          cmake --install build-rel --config Release

      - name: Locate the native library
        shell: bash
        run: |
          LIB=$(find build-rel \( -name 'libwccs.dll' -o -name 'wccs.dll' \
                 -o -name 'libwccs.so' -o -name 'libwccs.dylib' \) | head -1)
          test -n "$LIB"
          echo "native library: $LIB"
          echo "WCCS_LIB=$LIB" >> "$GITHUB_ENV"

      - name: Python wheel (native library bundled)
        shell: bash
        run: |
          cp "$WCCS_LIB" bindings/python/wccs/
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/wheels bindings/python

      - name: npm tarball (native library bundled)
        shell: bash
        run: |
          mkdir -p dist/npm
          cp "$WCCS_LIB" bindings/node/
          npm pack ./bindings/node --pack-destination "$GITHUB_WORKSPACE/dist/npm"

      - name: C# library + native dependency
        shell: bash
        run: |
          dotnet build bindings/csharp/Wccs/Wccs.csproj -c Release -o dist/csharp
          cp "$WCCS_LIB" dist/csharp/

      - name: Rust crate (vendored C source, self-contained)
        shell: bash
        run: |
          mkdir -p bindings/rust/vendor
          cp src/wccs.c include/wccs.h bindings/rust/vendor/
          cargo package --manifest-path bindings/rust/Cargo.toml \
                --allow-dirty --no-verify
          mkdir -p dist/rust
          cp bindings/rust/target/package/*.crate dist/rust/

      - name: Bundle platform artifacts
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          python -c "import os, shutil; shutil.make_archive('wccs-' + os.environ['OS_LABEL'] + '-artifacts', 'zip', 'dist')"

      - uses: actions/upload-artifact@v4
        with:
          name: wccs-dist-${{ matrix.os }}
          path: wccs-${{ matrix.os }}-artifacts.zip
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------- stage 5
  release:
    name: publish GitHub Release
    needs: [package, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          name: WCCS ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true

# Publishing to the language registries is still a manual step and needs
# repository secrets:
#   PyPI      : upload dist/wheels/*.whl (build a manylinux/macosx/win wheel)
#   NuGet     : dotnet nuget push with native libs under runtimes/{rid}/native/
#   npm       : npm publish dist/npm/*.tgz
#   crates.io : cargo publish dist/rust/*.crate
# All binding versions must resolve to the same WCCS_ABI_VERSION (section 6).
